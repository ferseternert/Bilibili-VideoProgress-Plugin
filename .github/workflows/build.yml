name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test progress rules and client adapter
        run: npm test
      - name: Build installer
        shell: powershell
        run: ./build.ps1
      - name: Test install and restore
        shell: powershell
        run: ./tests/installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BiliProgressSetup
          path: BiliProgressSetup.exe
